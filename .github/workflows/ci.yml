name: ci

permissions:
    contents: read

# Pull-request test gate. Builds the native extension on the same toolchain the release
# workflow uses (VS 2022 + Qt 6.8 + Slang) and runs the headless pytest suite. The
# tests only exercise CPU-side Slang reflection (ShaderDocument.compile), so they run
# fine under the offscreen Qt platform with no GPU on the runner.
#
# release.yml calls build-distributions.yml on PRs to main; this workflow adds the
# native tests and a reviewable teaching-site artifact. Production publication is gated
# separately by release.yml; this workflow retains read-only repository permission.

on:
    pull_request:
    push:
        # Every development push gets focused confidence. The generated documentation
        # branch is deployment output, not a source branch, and must not recurse into CI.
        branches-ignore: [docs]
    workflow_dispatch:

concurrency:
    # Keep PR and push runs separate so they cannot cancel each other's required gate.
    # Within each event type, a newer run for the same branch still replaces stale work.
    group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
    cancel-in-progress: true

env:
    SLANG_VERSION: "2026.14.1"
    QT_VERSION: "6.8.3"
    ANARI_SDK_COMMIT: "7897cbe425e5000ce890631bc97d14e00c750175"

jobs:
    changes:
        name: Confidence level
        # Cheap gate so the heavy Windows build below only runs when something that can
        # actually affect the native extension or the tests changed.
        runs-on: ubuntu-latest
        outputs:
            build: ${{ steps.filter.outputs.build }}
            confidence: ${{ steps.confidence.outputs.level }}
        steps:
            - name: Classify confidence level
              id: confidence
              shell: bash
              env:
                  BASE_REF: ${{ github.base_ref }}
                  REF: ${{ github.ref }}
              run: |
                  if [[ "$BASE_REF" == main || "$REF" == refs/heads/main ]]; then
                    level='Main Integration'
                  elif [[ "$BASE_REF" == release/* || "$REF" == refs/heads/release/* ]]; then
                    level='Release Stabilization'
                  else
                    level='Development CI'
                  fi
                  echo "level=$level" >> "$GITHUB_OUTPUT"
            - uses: actions/checkout@v7
            - uses: dorny/paths-filter@v4

              id: filter
              with:
                  filters: |
                      build:
                          - 'cpp/**'
                          - 'app/**'
                          - 'bindings/**'
                          - 'shaders/**'
                          - 'python/**'
                          - 'tests/**'
                          - 'cmake/**'
                          - 'spikes/**'
                          - 'CMakeLists.txt'
                          - 'pyproject.toml'
                          - 'src/docs/**'
                          - 'ci/capture_workbench.py'
                          - 'ci/build_docs.py'
                          - 'ci/docs_metadata.py'
                          - 'ci/publish_docs.py'
                          - 'ci/verify_doc_images.py'
                          - 'README.md'
                          - 'ARCHITECTURE.md'
                          - 'VISION.md'
                          - 'CHANGELOG.md'
                          - '.github/workflows/ci.yml'
                          - '.github/workflows/build-distributions.yml'
                          - '.github/workflows/release-pr-artifacts.yml'
                          - '.github/workflows/release.yml'
                          - 'ci/support-matrix.json'
                          - 'ci/validation_summary.py'

    lint:
        needs: changes
        name: ${{ needs.changes.outputs.confidence }} · Python checks
        # Pure-Python checks: no Qt/Slang toolchain needed, so they run in seconds on
        # Linux in parallel with the heavy Windows build below. Keep the example contract
        # here because examples/** intentionally does not trigger three native builds.
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v7
              with:
                  python-version: "3.12"
            - name: Install check dependencies
              run: python -m pip install "ruff==0.8.*" pytest
            - name: Lint
              run: ruff check .
            - name: Format check
              run: ruff format --check .
            - name: Check Python tool example
              run: python -m pytest tests/test_python_tool_example.py -q

    anari-backend:
        name: ${{ needs.changes.outputs.confidence }} · ANARI backend
        needs: changes
        if: needs.changes.outputs.build == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Build and install pinned ANARI-SDK
              shell: bash
              run: |
                  set -euo pipefail
                  git clone https://github.com/KhronosGroup/ANARI-SDK.git "$RUNNER_TEMP/anari-sdk"
                  git -C "$RUNNER_TEMP/anari-sdk" checkout "${ANARI_SDK_COMMIT}"
                  cmake -S "$RUNNER_TEMP/anari-sdk" -B "$RUNNER_TEMP/anari-sdk-build" \
                    -DCMAKE_BUILD_TYPE=Release \
                    -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/anari-install" \
                    -DBUILD_HELIDE_DEVICE=OFF \
                    -DBUILD_HELIDE_GPU_DEVICE=OFF \
                    -DBUILD_EXAMPLES=OFF \
                    -DBUILD_TESTING=OFF \
                    -DBUILD_CTS=OFF \
                    -DBUILD_HDANARI=OFF \
                    -DBUILD_CAT=OFF
                  cmake --build "$RUNNER_TEMP/anari-sdk-build" --parallel 2
                  cmake --install "$RUNNER_TEMP/anari-sdk-build"

            - name: Build standalone backend probe
              shell: bash
              run: |
                  set -euo pipefail
                  cmake -S spikes/anari_probe -B "$RUNNER_TEMP/miskeyed-anari-build" \
                    -DCMAKE_BUILD_TYPE=Release \
                    -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/anari-install" \
                    -DBUILD_TESTING=ON
                  cmake --build "$RUNNER_TEMP/miskeyed-anari-build" --parallel 2

            - name: Test candidate parsing and ANARI lifecycle
              shell: bash
              run: |
                  set -euo pipefail
                  ctest --test-dir "$RUNNER_TEMP/miskeyed-anari-build" --output-on-failure
                  export LD_LIBRARY_PATH="$RUNNER_TEMP/anari-install/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
                  "$RUNNER_TEMP/miskeyed-anari-build/workbench-anari-probe" \
                    "sink,$RUNNER_TEMP/anari-install/lib/"

    test:
        name: ${{ needs.changes.outputs.confidence }} · Windows x64 · Py${{ matrix.python-version }} · ${{ matrix.python-version == '3.11' && 'Source + Native + D3D11/Vulkan' || 'Source contracts' }}
        needs: changes
        # Skip the ~build-heavy job (and its check reports 'skipped' = success) when only
        # docs/CI-meta changed; the CI gate below still reports so the PR isn't blocked.
        if: needs.changes.outputs.build == 'true'
        # Same rationale as build-distributions.yml: pin VS 2022 so shiboken 6.8's
        # libclang can parse
        # the MSVC STL and the Qt win64_msvc2022_64 ABI matches.
        runs-on: windows-2022
        strategy:
            fail-fast: false
            matrix:
                # Focused source validation compiles once. Release stabilization and
                # main integration own the cross-version wheel confidence levels.
                python-version: ["3.11"]
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-python@v7
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Cache pip downloads
              uses: actions/cache@v6
              with:
                  path: ~\AppData\Local\pip\Cache
                  key: pip-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('.github/workflows/ci.yml') }}
                  restore-keys: |
                      pip-${{ runner.os }}-py${{ matrix.python-version }}-

            - name: Install Qt ${{ env.QT_VERSION }} dev SDK
              uses: jurplel/install-qt-action@v4
              with:
                  version: ${{ env.QT_VERSION }}
                  host: windows
                  target: desktop
                  arch: win64_msvc2022_64
                  # Cache the (large) Qt install between runs, keyed on version/arch.
                  cache: true
                  # Must be false: the default installs its own Python 3.12 and prepends it
                  # to PATH, which would clobber the matrix interpreter.
                  setup-python: false

            - name: Set up MSVC environment (x64)
              # Ninja (below) needs cl.exe on PATH. The VS generator finds MSVC on its own
              # but ignores compiler launchers, so we switch to Ninja to enable sccache.
              uses: ilammy/msvc-dev-cmd@v1
              with:
                  arch: x64

            - name: Set up sccache
              # Content-addressed compiler cache. Uses a LOCAL DISK backend (not the GitHub
              # Actions cache service): a GHAC outage would otherwise fail sccache's server
              # startup and take the whole build down. The dir is persisted below.
              uses: mozilla-actions/sccache-action@v0.0.11

            - name: Cache sccache objects
              uses: actions/cache@v6
              with:
                  path: ${{ runner.temp }}\sccache
                  key: sccache-${{ runner.os }}-py${{ matrix.python-version }}-${{ github.sha }}
                  restore-keys: |
                      sccache-${{ runner.os }}-py${{ matrix.python-version }}-

            - name: Cache Slang SDK
              id: slang-cache
              uses: actions/cache@v6
              with:
                  path: ${{ runner.temp }}\slang
                  key: slang-${{ runner.os }}-${{ env.SLANG_VERSION }}

            - name: Provision Slang SDK
              shell: pwsh
              run: |
                  $ErrorActionPreference = "Stop"
                  $ver = "${{ env.SLANG_VERSION }}"
                  $dest = "$env:RUNNER_TEMP\slang"
                  if (-not (Test-Path "$dest\bin\slang.dll")) {
                      $zip = "$env:RUNNER_TEMP\slang.zip"
                      $url = "https://github.com/shader-slang/slang/releases/download/v$ver/slang-$ver-windows-x86_64.zip"
                      Write-Host "Downloading $url"
                      Invoke-WebRequest -Uri $url -OutFile $zip
                      Expand-Archive -Path $zip -DestinationPath $dest -Force
                  } else {
                      Write-Host "Using cached Slang SDK at $dest"
                  }
                  "SLANG_ROOT=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append

            - name: Install build dependencies (Qt index)
              shell: pwsh
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install `
                    --index-url https://download.qt.io/official_releases/QtForPython/ `
                    --extra-index-url https://pypi.org/simple `
                    "PySide6==6.8.*" "shiboken6==6.8.*" "shiboken6-generator==6.8.*" `
                    "scikit-build-core==1.0.3"
                  python -m pip install pytest ninja

            - name: Build and install extension
              shell: pwsh
              env:
                  CMAKE_PREFIX_PATH: ${{ env.QT_ROOT_DIR }}
                  # Ninja honors the compiler launcher; the VS generator does not.
                  CMAKE_GENERATOR: Ninja
                  # Local disk cache (see "Set up sccache"): resilient to GHAC outages.
                  SCCACHE_DIR: ${{ runner.temp }}\sccache
              run: |
                  # Build isolation off (shiboken6-generator is not on PyPI); reuse the deps
                  # installed above. --no-deps keeps the Qt-index PySide6 in place.
                  python -m pip install . --no-build-isolation --no-deps -v `
                    --config-settings=cmake.define.CMAKE_C_COMPILER_LAUNCHER=sccache `
                    --config-settings=cmake.define.CMAKE_CXX_COMPILER_LAUNCHER=sccache
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  sccache --show-stats

            - name: Build native RHI smoke executable
              if: matrix.python-version == '3.11'
              shell: pwsh
              run: |
                  cmake -S . -B build-rhi-smoke -G Ninja `
                    -DCMAKE_BUILD_TYPE=Release `
                    -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
                    -DSLANG_ROOT="$env:SLANG_ROOT" `
                    -DMISKEYED_WORKBENCH_BUILD_APP=ON `
                    -DMISKEYED_WORKBENCH_BUILD_PYTHON=OFF `
                    -DBUILD_TESTING=ON
                  cmake --build build-rhi-smoke --parallel 2

            - name: Run native contract tests
              if: matrix.python-version == '3.11'
              shell: pwsh
              env:
                  QT_QPA_PLATFORM: offscreen
              run: |
                  $env:PATH = "$env:SLANG_ROOT\bin;$env:PATH"
                  ctest --test-dir build-rhi-smoke --output-on-failure

            - name: Smoke test QRhi D3D11
              if: matrix.python-version == '3.11'
              shell: pwsh
              run: |
                  $env:PATH = "$env:SLANG_ROOT\bin;$env:PATH"
                  .\build-rhi-smoke\miskeyed-workbench.exe --rhi d3d11 --rhi-smoke-test

            - name: Smoke test QRhi Vulkan
              if: matrix.python-version == '3.11'
              shell: pwsh
              run: |
                  # GitHub's Windows image ships Chrome's CPU Vulkan implementation.
                  # Point the Vulkan loader at its ICD so this is deterministic and does
                  # not depend on the hosted runner exposing a physical GPU.
                  $icd = Get-ChildItem "C:\Program Files\Google\Chrome\Application" `
                    -Filter vk_swiftshader_icd.json -Recurse -ErrorAction SilentlyContinue `
                    | Select-Object -First 1
                  if (-not $icd) { throw "Chrome SwiftShader Vulkan ICD was not found" }
                  $manifest = Get-Content $icd.FullName -Raw | ConvertFrom-Json
                  $driver = $manifest.ICD.library_path
                  if (-not [IO.Path]::IsPathRooted($driver)) {
                      $driver = Join-Path $icd.DirectoryName $driver
                  }
                  if (-not (Test-Path $driver)) { throw "SwiftShader driver not found: $driver" }
                  $env:VK_DRIVER_FILES = $icd.FullName
                  # VK_ICD_FILENAMES is the equivalent understood by older loaders.
                  $env:VK_ICD_FILENAMES = $icd.FullName
                  # Chrome's ICD manifest names vk_swiftshader.dll relatively. The
                  # Windows Vulkan loader searches PATH (not necessarily the manifest's
                  # directory), so make the ICD directory explicit.
                  $env:PATH = "$([IO.Path]::GetDirectoryName($driver));$env:SLANG_ROOT\bin;$env:PATH"
                  $env:QT_LOGGING_RULES = "qt.rhi.*=true"
                  .\build-rhi-smoke\miskeyed-workbench.exe --rhi vulkan --rhi-smoke-test

            - name: Run tests
              shell: pwsh
              env:
                  # SLANG_ROOT is exported by the Provision step; the package adds it to the
                  # DLL search path so _workbench.pyd can load slang.dll at import time.
                  QT_QPA_PLATFORM: offscreen
              run: python -m pytest tests/ -v

            - name: Build Documentation Preview Artifact
              if: matrix.python-version == '3.11'
              shell: pwsh
              env:
                  SOURCE_REF: ${{ github.head_ref }}
              run: |
                  python -m pip install -r src/docs/requirements.txt
                  $siteRoot = "$env:RUNNER_TEMP\workbench-documentation"
                  New-Item -ItemType Directory -Force -Path $siteRoot | Out-Null
                  python -m ci.build_docs --output "$siteRoot\site"
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  Set-Content -Path "$siteRoot\source-ref.txt" -Value "$env:SOURCE_REF"

            - name: Upload Documentation Preview Artifact
              if: matrix.python-version == '3.11'
              uses: actions/upload-artifact@v7
              with:
                  name: docs-preview
                  path: ${{ runner.temp }}/workbench-documentation

    publish-dev-docs:
        name: ${{ needs.changes.outputs.confidence }} · Public Dev Documentation
        needs: [changes, test]
        if: >-
            needs.test.result == 'success' &&
            ((github.event_name == 'pull_request' &&
              github.event.pull_request.head.repo.full_name == github.repository) ||
             (github.event_name == 'push' &&
              (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))))
        runs-on: ubuntu-latest
        concurrency:
            group: documentation-publication
            cancel-in-progress: false
        environment:
            name: documentation
            url: https://samjay3d.github.io/miskeyed-workbench/dev/
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7
            - uses: actions/download-artifact@v8
              with:
                  name: docs-preview
                  path: documentation-preview
            - name: Prepare mutable development documentation
              run: |
                  set -euo pipefail
                  if git ls-remote --exit-code --heads origin docs >/dev/null 2>&1; then
                      git fetch origin docs
                      git worktree add -B docs publish origin/docs
                  else
                      git worktree add --detach publish
                      git -C publish checkout --orphan docs
                      git -C publish rm -rf . >/dev/null 2>&1 || true
                  fi
                  python3 -m ci.publish_docs \
                    --site documentation-preview/site --publish-tree publish --channel dev
                  test -f publish/dev/index.html
            - name: Publish mutable development documentation
              run: |
                  set -euo pipefail
                  git -C publish config user.name github-actions[bot]
                  git -C publish config user.email 41898282+github-actions[bot]@users.noreply.github.com
                  git -C publish add --all
                  if git -C publish diff --cached --quiet; then
                      echo "Development documentation is already current."
                  else
                      git -C publish commit -m "docs: update development documentation from $GITHUB_REF_NAME"
                      git -C publish push origin docs
                  fi
            - name: Summarize docs branch publication
              run: |
                  set -euo pipefail
                  url=$(python3 -m ci.docs_metadata --field development_url)
                  remote=$(git ls-remote --heads origin docs | cut -f1)
                  test -n "$remote"
                  echo "Docs build, screenshot verification, artifact transfer, generated-tree verification, and docs-branch push succeeded."
                  echo "### [Development Documentation]($url)" >> "$GITHUB_STEP_SUMMARY"
                  echo "Pages propagation is asynchronous and is not a mutable-preview correctness gate."

    # Single aggregate check to require in branch protection / rulesets. It depends on every
    # other job, so requiring just "CI" transitively covers the whole matrix without having
    # to re-edit the rule whenever a Python version or confidence label is added or removed.
    # Keep this display name stable: branch protection matches the emitted check name.
    ci:
        name: CI
        if: always()
        needs: [changes, lint, anari-backend, test, publish-dev-docs]
        runs-on: ubuntu-latest
        steps:
            - name: Fail if any dependency failed
              if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
              run: exit 1
