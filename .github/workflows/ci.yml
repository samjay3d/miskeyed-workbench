name: ci

permissions:
    contents: read

# Pull-request test gate. Builds the native extension on the same toolchain the release
# workflow uses (VS 2022 + Qt 6.8 + Slang) and runs the headless pytest suite. The
# tests only exercise CPU-side Slang reflection (ShaderDocument.compile), so they run
# fine under the offscreen Qt platform with no GPU on the runner.
#
# release.yml already builds wheels on PRs to main; this workflow adds the actual test
# run. It triggers on pull requests only, so an open PR runs the suite exactly once
# instead of racing a duplicate push-event run (which showed up as a cancelled job with
# an unexpanded matrix name).

on:
    pull_request:
    workflow_dispatch:

concurrency:
    # One in-flight run per PR/branch; a newer push cancels the previous run.
    group: ci-${{ github.head_ref || github.ref_name }}
    cancel-in-progress: true

env:
    SLANG_VERSION: "2026.14.1"
    QT_VERSION: "6.8.3"
    ANARI_SDK_COMMIT: "7897cbe425e5000ce890631bc97d14e00c750175"

jobs:
    changes:
        name: Detect changes
        # Cheap gate so the heavy Windows build below only runs when something that can
        # actually affect the native extension or the tests changed.
        runs-on: ubuntu-latest
        outputs:
            build: ${{ steps.filter.outputs.build }}
        steps:
            - uses: actions/checkout@v7
            - uses: dorny/paths-filter@v3
              id: filter
              with:
                  filters: |
                      build:
                          - 'cpp/**'
                          - 'app/**'
                          - 'bindings/**'
                          - 'shaders/**'
                          - 'python/**'
                          - 'tests/**'
                          - 'cmake/**'
                          - 'spikes/**'
                          - 'CMakeLists.txt'
                          - 'pyproject.toml'
                          - '.github/workflows/ci.yml'

    lint:
        name: Lint (ruff)
        # Pure-Python check: no Qt/Slang toolchain needed, so it runs in seconds on Linux
        # in parallel with the heavy Windows build below.
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - name: Install ruff
              run: python -m pip install "ruff==0.8.*"
            - name: Lint
              run: ruff check .
            - name: Format check
              run: ruff format --check .

    anari-backend:
        name: ANARI backend
        needs: changes
        if: needs.changes.outputs.build == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Build and install pinned ANARI-SDK
              shell: bash
              run: |
                  set -euo pipefail
                  git clone https://github.com/KhronosGroup/ANARI-SDK.git "$RUNNER_TEMP/anari-sdk"
                  git -C "$RUNNER_TEMP/anari-sdk" checkout "${ANARI_SDK_COMMIT}"
                  cmake -S "$RUNNER_TEMP/anari-sdk" -B "$RUNNER_TEMP/anari-sdk-build" \
                    -DCMAKE_BUILD_TYPE=Release \
                    -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/anari-install" \
                    -DBUILD_HELIDE_DEVICE=OFF \
                    -DBUILD_HELIDE_GPU_DEVICE=OFF \
                    -DBUILD_EXAMPLES=OFF \
                    -DBUILD_TESTING=OFF \
                    -DBUILD_CTS=OFF \
                    -DBUILD_HDANARI=OFF \
                    -DBUILD_CAT=OFF
                  cmake --build "$RUNNER_TEMP/anari-sdk-build" --parallel 2
                  cmake --install "$RUNNER_TEMP/anari-sdk-build"

            - name: Build standalone backend probe
              shell: bash
              run: |
                  set -euo pipefail
                  cmake -S spikes/anari_probe -B "$RUNNER_TEMP/miskeyed-anari-build" \
                    -DCMAKE_BUILD_TYPE=Release \
                    -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/anari-install" \
                    -DBUILD_TESTING=ON
                  cmake --build "$RUNNER_TEMP/miskeyed-anari-build" --parallel 2

            - name: Test candidate parsing and ANARI lifecycle
              shell: bash
              run: |
                  set -euo pipefail
                  ctest --test-dir "$RUNNER_TEMP/miskeyed-anari-build" --output-on-failure
                  export LD_LIBRARY_PATH="$RUNNER_TEMP/anari-install/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
                  "$RUNNER_TEMP/miskeyed-anari-build/workbench-anari-probe" \
                    "sink,$RUNNER_TEMP/anari-install/lib/"

    test:
        name: Tests (py${{ matrix.python-version }})
        needs: changes
        # Skip the ~build-heavy job (and its check reports 'skipped' = success) when only
        # docs/CI-meta changed; the CI gate below still reports so the PR isn't blocked.
        if: needs.changes.outputs.build == 'true'
        # Same rationale as release.yml: pin VS 2022 so shiboken 6.8's libclang can parse
        # the MSVC STL and the Qt win64_msvc2022_64 ABI matches.
        runs-on: windows-2022
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.11", "3.12", "3.13"]
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Cache pip downloads
              uses: actions/cache@v4
              with:
                  path: ~\AppData\Local\pip\Cache
                  key: pip-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('.github/workflows/ci.yml') }}
                  restore-keys: |
                      pip-${{ runner.os }}-py${{ matrix.python-version }}-

            - name: Install Qt ${{ env.QT_VERSION }} dev SDK
              uses: jurplel/install-qt-action@v4
              with:
                  version: ${{ env.QT_VERSION }}
                  host: windows
                  target: desktop
                  arch: win64_msvc2022_64
                  # Cache the (large) Qt install between runs, keyed on version/arch.
                  cache: true
                  # Must be false: the default installs its own Python 3.12 and prepends it
                  # to PATH, which would clobber the matrix interpreter.
                  setup-python: false

            - name: Set up MSVC environment (x64)
              # Ninja (below) needs cl.exe on PATH. The VS generator finds MSVC on its own
              # but ignores compiler launchers, so we switch to Ninja to enable sccache.
              uses: ilammy/msvc-dev-cmd@v1
              with:
                  arch: x64

            - name: Set up sccache
              # Content-addressed compiler cache. Uses a LOCAL DISK backend (not the GitHub
              # Actions cache service): a GHAC outage would otherwise fail sccache's server
              # startup and take the whole build down. The dir is persisted below.
              uses: mozilla-actions/sccache-action@v0.0.6

            - name: Cache sccache objects
              uses: actions/cache@v4
              with:
                  path: ${{ runner.temp }}\sccache
                  key: sccache-${{ runner.os }}-py${{ matrix.python-version }}-${{ github.sha }}
                  restore-keys: |
                      sccache-${{ runner.os }}-py${{ matrix.python-version }}-

            - name: Cache Slang SDK
              id: slang-cache
              uses: actions/cache@v4
              with:
                  path: ${{ runner.temp }}\slang
                  key: slang-${{ runner.os }}-${{ env.SLANG_VERSION }}

            - name: Provision Slang SDK
              shell: pwsh
              run: |
                  $ErrorActionPreference = "Stop"
                  $ver = "${{ env.SLANG_VERSION }}"
                  $dest = "$env:RUNNER_TEMP\slang"
                  if (-not (Test-Path "$dest\bin\slang.dll")) {
                      $zip = "$env:RUNNER_TEMP\slang.zip"
                      $url = "https://github.com/shader-slang/slang/releases/download/v$ver/slang-$ver-windows-x86_64.zip"
                      Write-Host "Downloading $url"
                      Invoke-WebRequest -Uri $url -OutFile $zip
                      Expand-Archive -Path $zip -DestinationPath $dest -Force
                  } else {
                      Write-Host "Using cached Slang SDK at $dest"
                  }
                  "SLANG_ROOT=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append

            - name: Install build dependencies (Qt index)
              shell: pwsh
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install `
                    --index-url https://download.qt.io/official_releases/QtForPython/ `
                    --extra-index-url https://pypi.org/simple `
                    "PySide6==6.8.*" "shiboken6==6.8.*" "shiboken6-generator==6.8.*" `
                    "scikit-build-core==1.0.3"
                  python -m pip install pytest ninja

            - name: Build and install extension
              shell: pwsh
              env:
                  CMAKE_PREFIX_PATH: ${{ env.QT_ROOT_DIR }}
                  # Ninja honors the compiler launcher; the VS generator does not.
                  CMAKE_GENERATOR: Ninja
                  # Local disk cache (see "Set up sccache"): resilient to GHAC outages.
                  SCCACHE_DIR: ${{ runner.temp }}\sccache
              run: |
                  # Build isolation off (shiboken6-generator is not on PyPI); reuse the deps
                  # installed above. --no-deps keeps the Qt-index PySide6 in place.
                  python -m pip install . --no-build-isolation --no-deps -v `
                    --config-settings=cmake.define.CMAKE_C_COMPILER_LAUNCHER=sccache `
                    --config-settings=cmake.define.CMAKE_CXX_COMPILER_LAUNCHER=sccache
                  sccache --show-stats

            - name: Run tests
              shell: pwsh
              env:
                  # SLANG_ROOT is exported by the Provision step; the package adds it to the
                  # DLL search path so _slang_qrhi.pyd can load slang.dll at import time.
                  QT_QPA_PLATFORM: offscreen
              run: python -m pytest tests/ -v

    # Single aggregate check to require in branch protection / rulesets. It depends on every
    # other job, so requiring just "CI" transitively covers the whole matrix without having
    # to re-edit the rule whenever a Python version is added or removed.
    ci:
        name: CI
        if: always()
        needs: [changes, lint, anari-backend, test]
        runs-on: ubuntu-latest
        steps:
            - name: Fail if any dependency failed
              if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
              run: exit 1
