name: release

# Builds Windows, Linux, and macOS binary wheels plus an sdist on GitHub-hosted runners, and publishes them to
# PyPI via Trusted Publishing (OIDC — no stored tokens). Publishing is automatic: when a
# version bump lands on `main` (the pyproject version isn't on PyPI yet), this run builds
# and publishes, then records the `vX.Y.Z` tag + a GitHub Release. Pushing a `v*` tag by
# hand still works as a manual re-release path. No PAT is needed — the tag is created after
# publishing and is not relied upon to trigger anything.
#
# One-time maintainer setup:
#   1. PyPI + TestPyPI -> add a GitHub trusted publisher (owner, repo, workflow
#      `release.yml`, environments `pypi` / `testpypi`).
#   2. Repo -> Settings -> Environments -> create `pypi` and `testpypi`.
#   3. Repo -> Settings -> Pages -> set Source to `GitHub Actions`. GitHub creates the
#      `github-pages` environment automatically; do not add required reviewers. If its
#      deployment branches are restricted, allow `main` and any intentionally pushed
#      `v*` tags used by the manual re-release path.
#   4. Keep SLANG_VERSION in build-distributions.yml on the Slang release you build against.
#
# Windows wheels default to D3D11, Linux wheels to Vulkan, and macOS wheels to Metal.

on:
    push:
        branches: [main]
        tags: ["v*"]
        paths:
            - 'cpp/**'
            - 'app/**'
            - 'bindings/**'
            - 'shaders/**'
            - 'python/miskeyed/**'
            - 'tests/installed/**'
            - 'cmake/**'
            - 'CMakeLists.txt'
            - 'pyproject.toml'
            - '.github/workflows/build-distributions.yml'
    pull_request:
        branches: [main]
        paths:
            - 'cpp/**'
            - 'app/**'
            - 'bindings/**'
            - 'shaders/**'
            - 'python/miskeyed/**'
            - 'tests/installed/**'
            - 'cmake/**'
            - 'CMakeLists.txt'
            - 'pyproject.toml'
            - '.github/workflows/build-distributions.yml'
    workflow_dispatch:
        inputs:
            source_run_id:
                description: Existing release run ID to resume; leave blank for a new candidate
                required: false
            version:
                description: Expected version when resuming an existing candidate
                required: false

# Default to read-only. Publishing opts into OIDC per job; only the trusted documentation
# and final tag jobs receive the minimal write permissions they require.
permissions:
    contents: read

jobs:
    detect:
        name: Detect release
        # Decides whether this run should publish. Publishes when the pyproject version
        # isn't on PyPI yet (a bump landed on main) or when a v* tag was pushed. No PAT is
        # needed: publishing happens in THIS run, and the tag/Release are recorded after.
        runs-on: ubuntu-latest
        outputs:
            release: ${{ steps.decide.outputs.release }}
            version: ${{ steps.ver.outputs.version }}
        steps:
            - uses: actions/checkout@v7
            - name: Read version
              id: ver
              run: |
                  v=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "([^"]+)"/\1/')
                  echo "version=$v" >> "$GITHUB_OUTPUT"
                  echo "pyproject version: $v"
            - name: Decide
              id: decide
              run: |
                  set -euo pipefail
                  v="${{ steps.ver.outputs.version }}"
                  if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
                      echo "Tag push -> release."; echo "release=true" >> "$GITHUB_OUTPUT"; exit 0
                  fi
                  if [[ "$GITHUB_REF" == "refs/heads/main" && ( "$GITHUB_EVENT_NAME" == "push" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ) ]]; then
                      code=$(curl -sS -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/miskeyed-workbench/$v/json" || echo 000)
                      if [[ "$code" == "404" ]]; then
                          echo "Version $v not on PyPI -> release."; echo "release=true" >> "$GITHUB_OUTPUT"; exit 0
                      fi
                      echo "Version $v already on PyPI (HTTP $code) -> skip."
                  fi
                  echo "release=false" >> "$GITHUB_OUTPUT"

    build-distributions:
        name: Main Integration
        needs: detect
        # Every path into main receives the exhaustive supported wheel matrix. Release
        # detection controls publication only; it never controls validation confidence.
        if: >-
            inputs.source_run_id == '' && (
              github.event_name == 'pull_request' ||
              github.ref == 'refs/heads/main' ||
              startsWith(github.ref, 'refs/tags/v') ||
              github.event_name == 'workflow_dispatch'
            )
        uses: ./.github/workflows/build-distributions.yml
        with:
            python-versions: '["3.11", "3.12", "3.13"]'
        permissions:
            contents: read

    build-documentation:
        name: Build release documentation
        needs: [detect, build-distributions]
        if: needs.detect.outputs.release == 'true'
        runs-on: windows-2022
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
            - uses: actions/download-artifact@v8
              with:
                  name: wheel-windows-x64-py3.11
                  path: incoming
            - name: Install the release wheel and documentation tools
              shell: pwsh
              run: |
                  New-Item -ItemType Directory -Force wheelhouse | Out-Null
                  tar -xzf incoming\wheels-windows-x64-py3.11.tgz -C wheelhouse
                  $wheel = (Get-ChildItem wheelhouse\*.whl).FullName
                  python -m pip install $wheel
                  python -m pip install -r src/docs/requirements.txt
            - name: Capture, verify, and build the release documentation
              shell: pwsh
              run: |
                  $metadataVersion = python ci\docs_metadata.py --field version
                  if ($metadataVersion -ne "${{ needs.detect.outputs.version }}") {
                      throw "Documentation version $metadataVersion does not match release version"
                  }
                  python -m ci.build_docs --channel release --output build\documentation-site
            - uses: actions/upload-artifact@v7
              with:
                  name: docs-release
                  path: build/documentation-site

    publish-documentation:
        name: Publish versioned documentation
        needs: [detect, build-documentation]
        if: needs.detect.outputs.release == 'true'
        runs-on: ubuntu-latest
        concurrency:
            group: documentation-publication
            cancel-in-progress: false
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        permissions:
            contents: write
            pages: write
            id-token: write
        steps:
            - uses: actions/checkout@v7
            - uses: actions/download-artifact@v8
              with:
                  name: docs-release
                  path: generated-site
            - name: Prepare the generated docs branch
              env:
                  VERSION: ${{ needs.detect.outputs.version }}
              run: |
                  set -euo pipefail
                  if git ls-remote --exit-code --heads origin docs >/dev/null 2>&1; then
                      git fetch origin docs
                      git worktree add -B docs publish origin/docs
                  else
                      git worktree add --detach publish
                      git -C publish checkout --orphan docs
                      git -C publish rm -rf . >/dev/null 2>&1 || true
                  fi
                  python3 -m ci.publish_docs \
                    --site generated-site --publish-tree publish \
                    --channel release --version "$VERSION"
                  test -f "publish/$VERSION/index.html"
                  grep -F "/$VERSION/" publish/index.html
            - name: Publish the generated site
              env:
                  VERSION: ${{ needs.detect.outputs.version }}
              run: |
                  set -euo pipefail
                  git -C publish config user.name github-actions[bot]
                  git -C publish config user.email 41898282+github-actions[bot]@users.noreply.github.com
                  git -C publish add --all
                  if git -C publish diff --cached --quiet; then
                      echo "Documentation $VERSION is already published."
                  else
                      git -C publish commit -m "docs: publish Workbench $VERSION"
                      git -C publish push origin docs
                  fi
                  git ls-remote --exit-code --heads origin docs
            # The branch remains the immutable generated history. Pages is deployed
            # explicitly because GITHUB_TOKEN pushes do not trigger branch-source builds.
            - name: Upload the complete Pages site
              uses: actions/upload-pages-artifact@v4
              with:
                  path: publish
            - name: Deploy the complete Pages site
              id: deployment
              uses: actions/deploy-pages@v4
            - name: Verify the public versioned documentation
              env:
                  VERSION: ${{ needs.detect.outputs.version }}
              run: |
                  set -euo pipefail
                  url=$(python3 ci/docs_metadata.py --field versioned_url --version "$VERSION")
                  for attempt in $(seq 1 20); do
                      if ! page=$(curl --fail --silent --show-error --location "$url"); then
                          echo "Pages request failed (attempt $attempt/20); waiting 15 seconds."
                      elif grep -F "<p>Workbench $VERSION</p>" <<<"$page" >/dev/null; then
                          echo "### [Published Release Documentation $VERSION]($url)" >> "$GITHUB_STEP_SUMMARY"
                          echo "Published documentation is live at $url"
                          exit 0
                      else
                          echo "Pages loaded without the Workbench $VERSION release marker (attempt $attempt/20); waiting 15 seconds."
                      fi
                      sleep 15
                  done
                  echo "Documentation did not become public at $url" >&2
                  exit 1

    publish-testpypi:
        name: Publish to TestPyPI
        needs: [detect, build-distributions, publish-documentation]
        if: needs.detect.outputs.release == 'true'
        runs-on: ubuntu-latest
        environment:
            name: testpypi
            url: https://test.pypi.org/p/miskeyed-workbench
        permissions:
            id-token: write
        steps:
            - uses: actions/checkout@v7
            - uses: actions/download-artifact@v8
              with:
                  name: release-candidate
                  path: candidate
            - name: Assemble dist/
              # Wheels arrive as wheels-*.tgz (gzip CRC = transport integrity); the sdist
              # arrives as a plain *.tar.gz and passes through untouched.
              run: |
                  set -euo pipefail
                  python3 ci/assemble_release.py assemble --candidate candidate --output dist \
                    --source-sha "$GITHUB_SHA" --version "${{ needs.detect.outputs.version }}"
                  ls -la dist/
            - name: Normalize wheel ZIPs for PyPI
              # Rewrites each wheel as a canonical, seekable archive (member bytes verbatim,
              # so RECORD stays valid). Also revalidates CRCs as a final backstop.
              run: python3 ci/wheelzip.py normalize dist/*.whl
            - uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  repository-url: https://test.pypi.org/legacy/
                  skip-existing: true

    publish-pypi:
        name: Publish to PyPI
        needs: [detect, publish-testpypi]
        if: needs.detect.outputs.release == 'true'
        runs-on: ubuntu-latest
        environment:
            name: pypi
            url: https://pypi.org/p/miskeyed-workbench
        permissions:
            id-token: write
        steps:
            - uses: actions/checkout@v7
            - uses: actions/download-artifact@v8
              with:
                  name: release-candidate
                  path: candidate
            - name: Assemble dist/
              run: |
                  set -euo pipefail
                  python3 ci/assemble_release.py assemble --candidate candidate --output dist \
                    --source-sha "$GITHUB_SHA" --version "${{ needs.detect.outputs.version }}"
                  ls -la dist/
            - name: Normalize wheel ZIPs for PyPI
              run: python3 ci/wheelzip.py normalize dist/*.whl
            - uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  skip-existing: true

    tag-release:
        name: Tag + GitHub Release
        needs: [detect, publish-pypi]
        # Record the release AFTER documentation and package publication. Uses the default
        # token; an existing manual tag is reused rather than pushed again.
        if: needs.detect.outputs.release == 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7
            - name: Tag and release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  v="${{ needs.detect.outputs.version }}"
                  tag="v$v"
                  if git ls-remote --tags origin "refs/tags/$tag" | grep -q "refs/tags/$tag"; then
                      echo "Tag $tag already exists."
                  else
                      git tag "$tag"
                      git push origin "$tag"
                  fi
                  if gh release view "$tag" >/dev/null 2>&1; then
                      echo "Release $tag already exists."
                  else
                      notes=$(awk -v v="$v" '$0 ~ "^## \\["v"\\]"{f=1;next} /^## \[/{f=0} f' CHANGELOG.md)
                      docs_url=$(python3 ci/docs_metadata.py --field versioned_url --version "$v")
                      pypi_url="https://pypi.org/project/miskeyed-workbench/$v/"
                      support=$(python3 ci/validation_summary.py release-support)
                      notes="${notes:-Release $tag}"$'\n\n'"$support"$'\n\n'"[PyPI $v]($pypi_url) · [Documentation $v]($docs_url)"
                      gh release create "$tag" --title "Workbench $tag" --notes "$notes"
                  fi
    validate-candidate-run:
        name: Validate candidate run and manifest
        if: github.event_name == 'workflow_dispatch' && inputs.source_run_id != ''
        runs-on: ubuntu-latest
        outputs:
            source_sha: ${{ steps.run.outputs.source_sha }}
        steps:
            - uses: actions/checkout@v7
            - name: Validate trusted source run
              id: run
              env:
                  GH_TOKEN: ${{ github.token }}
                  RUN_ID: ${{ inputs.source_run_id }}
                  EXPECTED_VERSION: ${{ inputs.version }}
              run: |
                  set -euo pipefail
                  run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")
                  workflow=$(jq -r .path <<<"$run")
                  branch=$(jq -r .head_branch <<<"$run")
                  sha=$(jq -r .head_sha <<<"$run")
                  [[ -n "$EXPECTED_VERSION" ]] || { echo "version is required when resuming" >&2; exit 1; }
                  [[ "$workflow" == .github/workflows/release.yml ]] || {
                    echo "source run used untrusted workflow: $workflow" >&2; exit 1;
                  }
                  [[ "$branch" == main || "$branch" == release/* ]] || {
                    echo "source run has disallowed branch: $branch" >&2; exit 1;
                  }
                  gh api "repos/$GITHUB_REPOSITORY/commits/$sha" >/dev/null
                  candidate_result=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" \
                    --jq '[.jobs[] | select(.name | endswith("Seal validated release candidate")) | .conclusion] | first // "missing"')
                  [[ "$candidate_result" == success ]] || {
                    echo "candidate sealing job did not succeed: $candidate_result" >&2; exit 1;
                  }
                  source_version=$(gh api -H 'Accept: application/vnd.github.raw+json' \
                    "repos/$GITHUB_REPOSITORY/contents/pyproject.toml?ref=$sha" \
                    | sed -nE 's/^version = "([^"]+)"/\1/p')
                  [[ "$source_version" == "$EXPECTED_VERSION" ]] || {
                    echo "source version $source_version does not match requested $EXPECTED_VERSION" >&2; exit 1;
                  }
                  echo "source_sha=$sha" >> "$GITHUB_OUTPUT"
            - uses: actions/download-artifact@v8
              with:
                  name: release-candidate
                  path: candidate
                  run-id: ${{ inputs.source_run_id }}
                  github-token: ${{ github.token }}
            - name: Verify manifest, digests, archives, wheels, and count
              run: |
                  jq -e '.python_versions == ["3.11", "3.12", "3.13"] and
                    .platforms == ["windows-x64", "linux-x64", "macos-arm64", "macos-x64"] and
                    (.wheels | length) == 12' candidate/candidate-manifest.json >/dev/null || {
                      echo "candidate does not contain the complete Windows/Linux/macOS release matrix" >&2
                      exit 1
                  }
                  python3 ci/assemble_release.py assemble --candidate candidate --output dist \
                    --source-sha "${{ steps.run.outputs.source_sha }}" --version "${{ inputs.version }}"
                  python3 ci/wheelzip.py normalize dist/*.whl
            - uses: actions/upload-artifact@v7
              with:
                  name: resumed-dist
                  path: dist
                  retention-days: 7

    resume-testpypi:
        needs: validate-candidate-run
        runs-on: ubuntu-latest
        environment: testpypi
        permissions:
            id-token: write
        steps:
            - uses: actions/download-artifact@v8
              with: {name: resumed-dist, path: dist}
            - uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  repository-url: https://test.pypi.org/legacy/
                  skip-existing: true

    resume-pypi:
        needs: [validate-candidate-run, resume-testpypi]
        runs-on: ubuntu-latest
        environment: pypi
        permissions:
            id-token: write
        steps:
            - uses: actions/download-artifact@v8
              with: {name: resumed-dist, path: dist}
            - uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  skip-existing: true

    resume-tag-release:
        needs: [validate-candidate-run, resume-pypi]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7
              with: {fetch-depth: 0}
            - name: Create or verify tag and release
              env:
                  GH_TOKEN: ${{ github.token }}
                  SHA: ${{ needs.validate-candidate-run.outputs.source_sha }}
                  VERSION: ${{ inputs.version }}
              run: |
                  set -euo pipefail
                  tag="v$VERSION"
                  remote=$(git ls-remote --tags origin "refs/tags/$tag" | cut -f1)
                  [[ -z "$remote" || "$remote" == "$SHA" ]] || { echo "$tag points to $remote, not $SHA" >&2; exit 1; }
                  if [[ -z "$remote" ]]; then git tag "$tag" "$SHA"; git push origin "$tag"; fi
                  if gh release view "$tag" >/dev/null 2>&1; then
                    release_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)
                    [[ "$release_sha" == "$SHA" ]] || exit 1
                  else
                    gh release create "$tag" --target "$SHA" --title "Workbench $tag" --generate-notes
                  fi
