name: release

# Builds Windows binary wheels + an sdist on GitHub-hosted runners, and publishes them to
# PyPI via Trusted Publishing (OIDC — no stored tokens). Publishing is automatic: when a
# version bump lands on `main` (the pyproject version isn't on PyPI yet), this run builds
# and publishes, then records the `vX.Y.Z` tag + a GitHub Release. Pushing a `v*` tag by
# hand still works as a manual re-release path. No PAT is needed — the tag is created after
# publishing and is not relied upon to trigger anything.
#
# One-time maintainer setup:
#   1. PyPI + TestPyPI -> add a GitHub trusted publisher (owner, repo, workflow
#      `release.yml`, environments `pypi` / `testpypi`).
#   2. Repo -> Settings -> Environments -> create `pypi` and `testpypi`.
#   3. Keep SLANG_VERSION below on the Slang release you build against.
#
# This project is Windows / Direct3D 11. macOS/Linux wheels are future work.

on:
    push:
        branches: [main]
        tags: ["v*"]
    pull_request:
        branches: [main]
    workflow_dispatch:

env:
    SLANG_VERSION: "2026.14.1"
    QT_VERSION: "6.8.3"

jobs:
    detect:
        name: Detect release
        # Decides whether this run should publish. Publishes when the pyproject version
        # isn't on PyPI yet (a bump landed on main) or when a v* tag was pushed. No PAT is
        # needed: publishing happens in THIS run, and the tag/Release are recorded after.
        runs-on: ubuntu-latest
        outputs:
            release: ${{ steps.decide.outputs.release }}
            version: ${{ steps.ver.outputs.version }}
        steps:
            - uses: actions/checkout@v4
            - name: Read version
              id: ver
              run: |
                  v=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "([^"]+)"/\1/')
                  echo "version=$v" >> "$GITHUB_OUTPUT"
                  echo "pyproject version: $v"
            - name: Decide
              id: decide
              run: |
                  set -euo pipefail
                  v="${{ steps.ver.outputs.version }}"
                  if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
                      echo "Tag push -> release."; echo "release=true" >> "$GITHUB_OUTPUT"; exit 0
                  fi
                  if [[ "$GITHUB_REF" == "refs/heads/main" && ( "$GITHUB_EVENT_NAME" == "push" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ) ]]; then
                      code=$(curl -sS -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/miskeyed-workbench/$v/json" || echo 000)
                      if [[ "$code" == "404" ]]; then
                          echo "Version $v not on PyPI -> release."; echo "release=true" >> "$GITHUB_OUTPUT"; exit 0
                      fi
                      echo "Version $v already on PyPI (HTTP $code) -> skip."
                  fi
                  echo "release=false" >> "$GITHUB_OUTPUT"

    build-wheels:
        name: Wheel (py${{ matrix.python-version }})
        needs: detect
        # Build for a real release, and on PRs to main for validation.
        if: needs.detect.outputs.release == 'true' || github.event_name == 'pull_request'
        # Pin to VS 2022, not windows-latest: the latest image (windows-2025-vs2026,
        # MSVC 14.5x) ships an STL that uses __builtin_verbose_trap, which shiboken
        # 6.8's bundled libclang can't parse (ApiExtractor fails). VS 2022 also matches
        # Qt's win64_msvc2022_64 ABI, so it's the correct toolchain regardless.
        runs-on: windows-2022
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.11", "3.12", "3.13"]
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Cache pip downloads
              uses: actions/cache@v4
              with:
                  path: ~\AppData\Local\pip\Cache
                  key: pip-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('.github/workflows/release.yml') }}
                  restore-keys: |
                      pip-${{ runner.os }}-py${{ matrix.python-version }}-

            - name: Install Qt ${{ env.QT_VERSION }} dev SDK
              uses: jurplel/install-qt-action@v4
              with:
                  version: ${{ env.QT_VERSION }}
                  host: windows
                  target: desktop
                  arch: win64_msvc2022_64
                  # Cache the (large) Qt install between runs, keyed on version/arch.
                  cache: true
                  # Must be false: the default installs its OWN Python 3.12 for aqtinstall
                  # and prepends it to PATH, so every matrix job would build a cp312 wheel
                  # (they then overwrite each other on publish). Leaving our setup-python
                  # interpreter in place makes each job produce its correct cp3xx wheel.
                  setup-python: false

            - name: Set up MSVC environment (x64)
              # Ninja (below) needs cl.exe on PATH; the VS generator finds MSVC on its own
              # but ignores compiler launchers, so we switch to Ninja to enable sccache.
              uses: ilammy/msvc-dev-cmd@v1
              with:
                  arch: x64

            - name: Set up sccache
              # Content-addressed compiler cache. Uses a LOCAL DISK backend (not the GitHub
              # Actions cache service): a GHAC outage would otherwise fail sccache's server
              # startup and take the whole build down. The dir is persisted below.
              uses: mozilla-actions/sccache-action@v0.0.6

            - name: Cache sccache objects
              uses: actions/cache@v4
              with:
                  path: ${{ runner.temp }}\sccache
                  key: sccache-${{ runner.os }}-py${{ matrix.python-version }}-${{ github.sha }}
                  restore-keys: |
                      sccache-${{ runner.os }}-py${{ matrix.python-version }}-

            - name: Cache Slang SDK
              id: slang-cache
              uses: actions/cache@v4
              with:
                  path: ${{ runner.temp }}\slang
                  key: slang-${{ runner.os }}-${{ env.SLANG_VERSION }}

            - name: Provision Slang SDK
              shell: pwsh
              run: |
                  $ErrorActionPreference = "Stop"
                  $ver = "${{ env.SLANG_VERSION }}"
                  $dest = "$env:RUNNER_TEMP\slang"
                  if (-not (Test-Path "$dest\bin\slang.dll")) {
                      $zip = "$env:RUNNER_TEMP\slang.zip"
                      $url = "https://github.com/shader-slang/slang/releases/download/v$ver/slang-$ver-windows-x86_64.zip"
                      Write-Host "Downloading $url"
                      Invoke-WebRequest -Uri $url -OutFile $zip
                      Expand-Archive -Path $zip -DestinationPath $dest -Force
                  } else {
                      Write-Host "Using cached Slang SDK at $dest"
                  }
                  "SLANG_ROOT=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append

            - name: Install build dependencies (Qt index)
              shell: pwsh
              run: |
                  python -m pip install --upgrade pip
                  # shiboken6-generator only exists on Qt's index; the rest resolve from PyPI.
                  # scikit-build-core is pinned: newer wheel writers emit a ZIP record PyPI
                  # rejects ("Unknown record signature"); 1.0.3 is verified compliant.
                  python -m pip install `
                    --index-url https://download.qt.io/official_releases/QtForPython/ `
                    --extra-index-url https://pypi.org/simple `
                    "PySide6==6.8.*" "shiboken6==6.8.*" "shiboken6-generator==6.8.*" `
                    "scikit-build-core==1.0.3"
                  python -m pip install ninja

            - name: Build wheel
              shell: pwsh
              env:
                  CMAKE_PREFIX_PATH: ${{ env.QT_ROOT_DIR }}
                  # Ninja honors the compiler launcher; the VS generator does not.
                  CMAKE_GENERATOR: Ninja
                  # Local disk cache (see "Set up sccache"): resilient to GHAC outages.
                  SCCACHE_DIR: ${{ runner.temp }}\sccache
              run: |
                  # Build isolation is off because shiboken6-generator is not on PyPI;
                  # the build deps installed above are used directly. CMake finds Qt via
                  # CMAKE_PREFIX_PATH and Slang via SLANG_ROOT (see cmake/FindSlang.cmake).
                  python -m pip wheel . --no-build-isolation --no-deps -w wheelhouse -v `
                    --config-settings=cmake.define.CMAKE_C_COMPILER_LAUNCHER=sccache `
                    --config-settings=cmake.define.CMAKE_CXX_COMPILER_LAUNCHER=sccache
                  sccache --show-stats

            - name: Verify fresh wheel is not corrupt
              shell: pwsh
              # FATAL on purpose: (1) the wheel's ABI tag must match this matrix Python,
              # else the wrong interpreter built it and the tars would collide on publish;
              # (2) validate every member's CRC-32 before transport (corruption was proven
              # to come from upload/download-artifact, hence the tar bundling below).
              run: |
                  $expected = "cp" + "${{ matrix.python-version }}".Replace(".", "")
                  $whls = (Get-ChildItem wheelhouse\*.whl).FullName
                  foreach ($w in $whls) {
                      if ((Split-Path $w -Leaf) -notmatch $expected) {
                          throw "Wheel '$(Split-Path $w -Leaf)' is not tagged '$expected' - wrong interpreter built it."
                      }
                  }
                  python ci\wheelzip.py inspect $whls

            - name: Bundle wheel for transport
              shell: pwsh
              # Ship one gzip'd tar instead of loose .whl files. upload-artifact@v4
              # corrupts the bundled binaries when it re-zips a wheel; wrapping in a tar.gz
              # makes the payload opaque and gives it a gzip CRC, so any transport
              # corruption fails `tar -xzf` on download instead of reaching PyPI.
              run: tar -czf "wheels-${{ matrix.python-version }}.tgz" -C wheelhouse .

            - uses: actions/upload-artifact@v7
              with:
                  name: dist-wheels-${{ matrix.python-version }}
                  path: wheels-${{ matrix.python-version }}.tgz

    build-sdist:
        name: Source distribution
        needs: detect
        if: needs.detect.outputs.release == 'true' || github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - name: Build sdist
              run: |
                  # Pinned: newer scikit-build-core wheel writers emit a ZIP record PyPI's
                  # strict validator rejects ("Unknown record signature"); 1.0.3 is verified
                  # compliant. Kept identical in the wheel job for reproducibility.
                  python -m pip install "scikit-build-core==1.0.3"
                  mkdir -p dist
                  # Call the sdist backend directly. `python -m build` (even with
                  # --no-isolation) refuses to run unless every build-system.requires is
                  # installed, but the Qt-only PySide6/shiboken6/shiboken6-generator are
                  # irrelevant to packaging source — scikit-build-core just collects files.
                  python -c "import scikit_build_core.build as b; print(b.build_sdist('dist'))"
            - uses: actions/upload-artifact@v7
              with:
                  name: dist-sdist
                  path: ./dist/*.tar.gz

    publish-testpypi:
        name: Publish to TestPyPI
        needs: [detect, build-wheels, build-sdist]
        if: needs.detect.outputs.release == 'true'
        runs-on: ubuntu-latest
        environment:
            name: testpypi
            url: https://test.pypi.org/p/miskeyed-workbench
        permissions:
            id-token: write
        steps:
            - uses: actions/checkout@v4
            - uses: actions/download-artifact@v4
              with:
                  pattern: dist-*
                  path: incoming
                  merge-multiple: true
            - name: Assemble dist/
              # Wheels arrive as wheels-*.tgz (gzip CRC = transport integrity); the sdist
              # arrives as a plain *.tar.gz and passes through untouched.
              run: |
                  set -euo pipefail
                  shopt -s nullglob
                  mkdir -p dist
                  for f in incoming/*.tar.gz; do cp "$f" dist/; done
                  for t in incoming/*.tgz; do tar -xzf "$t" -C dist; done
                  ls -la dist/
            - name: Normalize wheel ZIPs for PyPI
              # Rewrites each wheel as a canonical, seekable archive (member bytes verbatim,
              # so RECORD stays valid). Also revalidates CRCs as a final backstop.
              run: python3 ci/wheelzip.py normalize dist/*.whl
            - uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  repository-url: https://test.pypi.org/legacy/
                  skip-existing: true

    publish-pypi:
        name: Publish to PyPI
        needs: [detect, publish-testpypi]
        if: needs.detect.outputs.release == 'true'
        runs-on: ubuntu-latest
        environment:
            name: pypi
            url: https://pypi.org/p/miskeyed-workbench
        permissions:
            id-token: write
        steps:
            - uses: actions/checkout@v4
            - uses: actions/download-artifact@v4
              with:
                  pattern: dist-*
                  path: incoming
                  merge-multiple: true
            - name: Assemble dist/
              run: |
                  set -euo pipefail
                  shopt -s nullglob
                  mkdir -p dist
                  for f in incoming/*.tar.gz; do cp "$f" dist/; done
                  for t in incoming/*.tgz; do tar -xzf "$t" -C dist; done
                  ls -la dist/
            - name: Normalize wheel ZIPs for PyPI
              run: python3 ci/wheelzip.py normalize dist/*.whl
            - uses: pypa/gh-action-pypi-publish@release/v1

    tag-release:
        name: Tag + GitHub Release
        needs: [detect, publish-pypi]
        # Record the release AFTER publishing. Uses the default token; the tag it pushes
        # deliberately does NOT re-trigger this workflow (we already published). Skipped on
        # manual tag runs (the tag already exists).
        if: needs.detect.outputs.release == 'true' && !startsWith(github.ref, 'refs/tags/')
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
            - name: Tag and release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  v="${{ needs.detect.outputs.version }}"
                  tag="v$v"
                  if git ls-remote --tags origin "refs/tags/$tag" | grep -q "refs/tags/$tag"; then
                      echo "Tag $tag already exists."
                  else
                      git tag "$tag"
                      git push origin "$tag"
                  fi
                  if gh release view "$tag" >/dev/null 2>&1; then
                      echo "Release $tag already exists."
                  else
                      notes=$(awk -v v="$v" '$0 ~ "^## \\["v"\\]"{f=1;next} /^## \[/{f=0} f' CHANGELOG.md)
                      gh release create "$tag" --title "$tag" --notes "${notes:-Release $tag}"
                  fi
