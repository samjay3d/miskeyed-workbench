name: build distributions

# The one implementation of candidate packaging. Release publication and release-branch
# review builds call this workflow, so neither has to inherit the other's permissions.
on:
    workflow_call:
        inputs:
            python-versions:
                description: JSON array of Python versions included in this gate.
                type: string
                default: '["3.11", "3.12", "3.13"]'
    workflow_dispatch:
        inputs:
            python-versions:
                description: JSON array of Python versions included in this gate.
                default: '["3.11", "3.12", "3.13"]'

permissions:
    contents: read

env:
    SLANG_VERSION: "2026.14.1"
    QT_VERSION: "6.8.3"

jobs:
    build-wheels:
        name: Windows x64 · Py${{ matrix.python-version }} · ${{ matrix.python-version == '3.11' && 'Wheel + Contracts + D3D11/Vulkan' || 'Wheel + Contracts' }}
        # Pin to VS 2022, not windows-latest: the latest image (windows-2025-vs2026,
        # MSVC 14.5x) ships an STL that uses __builtin_verbose_trap, which shiboken
        # 6.8's bundled libclang can't parse (ApiExtractor fails). VS 2022 also matches
        # Qt's win64_msvc2022_64 ABI, so it's the correct toolchain regardless.
        runs-on: windows-2022
        strategy:
            fail-fast: false
            matrix:
                python-version: ${{ fromJSON(inputs.python-versions) }}
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Cache pip downloads
              uses: actions/cache@v6
              with:
                  path: ~\AppData\Local\pip\Cache
                  key: pip-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('.github/workflows/build-distributions.yml') }}
                  restore-keys: |
                      pip-${{ runner.os }}-py${{ matrix.python-version }}-

            - name: Install Qt ${{ env.QT_VERSION }} dev SDK
              uses: jurplel/install-qt-action@v4
              with:
                  version: ${{ env.QT_VERSION }}
                  host: windows
                  target: desktop
                  arch: win64_msvc2022_64
                  # Cache the (large) Qt install between runs, keyed on version/arch.
                  cache: true
                  # Must be false: the default installs its OWN Python 3.12 for aqtinstall
                  # and prepends it to PATH, so every matrix job would build a cp312 wheel
                  # (they then overwrite each other on publish). Leaving our setup-python
                  # interpreter in place makes each job produce its correct cp3xx wheel.
                  setup-python: false

            - name: Set up MSVC environment (x64)
              # Ninja (below) needs cl.exe on PATH; the VS generator finds MSVC on its own
              # but ignores compiler launchers, so we switch to Ninja to enable sccache.
              uses: ilammy/msvc-dev-cmd@v1
              with:
                  arch: x64

            - name: Set up sccache
              # Content-addressed compiler cache. Uses a LOCAL DISK backend (not the GitHub
              # Actions cache service): a GHAC outage would otherwise fail sccache's server
              # startup and take the whole build down. The dir is persisted below.
              uses: mozilla-actions/sccache-action@v0.0.11

            - name: Cache sccache objects
              uses: actions/cache@v6
              with:
                  path: ${{ runner.temp }}\sccache
                  key: sccache-${{ runner.os }}-py${{ matrix.python-version }}-${{ github.sha }}
                  restore-keys: |
                      sccache-${{ runner.os }}-py${{ matrix.python-version }}-

            - name: Cache Slang SDK
              id: slang-cache
              uses: actions/cache@v6
              with:
                  path: ${{ runner.temp }}\slang
                  key: slang-${{ runner.os }}-${{ env.SLANG_VERSION }}

            - name: Provision Slang SDK
              shell: pwsh
              run: |
                  $ErrorActionPreference = "Stop"
                  $ver = "${{ env.SLANG_VERSION }}"
                  $dest = "$env:RUNNER_TEMP\slang"
                  if (-not (Test-Path "$dest\bin\slang.dll")) {
                      $zip = "$env:RUNNER_TEMP\slang.zip"
                      $url = "https://github.com/shader-slang/slang/releases/download/v$ver/slang-$ver-windows-x86_64.zip"
                      Write-Host "Downloading $url"
                      Invoke-WebRequest -Uri $url -OutFile $zip
                      Expand-Archive -Path $zip -DestinationPath $dest -Force
                  } else {
                      Write-Host "Using cached Slang SDK at $dest"
                  }
                  "SLANG_ROOT=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append

            - name: Install build dependencies (Qt index)
              shell: pwsh
              run: |
                  python -m pip install --upgrade pip
                  # shiboken6-generator only exists on Qt's index; the rest resolve from PyPI.
                  # scikit-build-core is pinned: newer wheel writers emit a ZIP record PyPI
                  # rejects ("Unknown record signature"); 1.0.3 is verified compliant.
                  python -m pip install `
                    --index-url https://download.qt.io/official_releases/QtForPython/ `
                    --extra-index-url https://pypi.org/simple `
                    "PySide6==6.8.*" "shiboken6==6.8.*" "shiboken6-generator==6.8.*" `
                    "scikit-build-core==1.0.3"
                  python -m pip install ninja

            - name: Build wheel
              shell: pwsh
              env:
                  CMAKE_PREFIX_PATH: ${{ env.QT_ROOT_DIR }}
                  # Ninja honors the compiler launcher; the VS generator does not.
                  CMAKE_GENERATOR: Ninja
                  # Local disk cache (see "Set up sccache"): resilient to GHAC outages.
                  SCCACHE_DIR: ${{ runner.temp }}\sccache
              run: |
                  # Build isolation is off because shiboken6-generator is not on PyPI;
                  # the build deps installed above are used directly. CMake finds Qt via
                  # CMAKE_PREFIX_PATH and Slang via SLANG_ROOT (see cmake/FindSlang.cmake).
                  python -m pip wheel . --no-build-isolation --no-deps -w wheelhouse -v `
                    --config-settings=cmake.define.CMAKE_C_COMPILER_LAUNCHER=sccache `
                    --config-settings=cmake.define.CMAKE_CXX_COMPILER_LAUNCHER=sccache
                  sccache --show-stats

            - name: Verify fresh wheel is not corrupt
              id: package
              shell: pwsh
              # FATAL on purpose: (1) the wheel's ABI tag must match this matrix Python,
              # else the wrong interpreter built it and the tars would collide on publish;
              # (2) validate every member's CRC-32 before transport (corruption was proven
              # to come from upload/download-artifact, hence the tar bundling below).
              run: |
                  $expected = "cp" + "${{ matrix.python-version }}".Replace(".", "")
                  $whls = (Get-ChildItem wheelhouse\*.whl).FullName
                  foreach ($w in $whls) {
                      if ((Split-Path $w -Leaf) -notmatch $expected) {
                          throw "Wheel '$(Split-Path $w -Leaf)' is not tagged '$expected' - wrong interpreter built it."
                      }
                  }
                  python ci\wheelzip.py inspect $whls

            - name: Verify fresh wheel install and import
              id: installed
              shell: pwsh
              env:
                  QT_QPA_PLATFORM: offscreen
                  SLANG_ROOT: ""
              run: |
                  $env:PATH = (($env:PATH -split ';') | Where-Object { $_ -notlike "$env:RUNNER_TEMP\slang*" }) -join ';'
                  $wheel = (Get-ChildItem wheelhouse\*.whl).FullName
                  python -m venv "$env:RUNNER_TEMP\wheel-check"
                  & "$env:RUNNER_TEMP\wheel-check\Scripts\python.exe" -m pip install $wheel
                  & "$env:RUNNER_TEMP\wheel-check\Scripts\python.exe" -c "import miskeyed.workbench as w; assert w.WorkbenchWindow"

            - name: Run installed-wheel contracts
              id: contracts
              shell: pwsh
              env:
                  QT_QPA_PLATFORM: offscreen
                  SLANG_ROOT: ""
              run: |
                  $env:PATH = (($env:PATH -split ';') | Where-Object { $_ -notlike "$env:RUNNER_TEMP\slang*" }) -join ';'
                  & "$env:RUNNER_TEMP\wheel-check\Scripts\python.exe" -m pip install pytest
                  & "$env:RUNNER_TEMP\wheel-check\Scripts\python.exe" -m pytest tests\installed -v

            - name: Build canonical native contract and RHI smoke harness
              if: matrix.python-version == '3.11'
              shell: pwsh
              run: |
                  cmake -S . -B build-native -G Ninja `
                    -DCMAKE_BUILD_TYPE=Release `
                    -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
                    -DSLANG_ROOT="$env:SLANG_ROOT" `
                    -DMISKEYED_WORKBENCH_BUILD_APP=ON `
                    -DMISKEYED_WORKBENCH_BUILD_PYTHON=OFF `
                    -DBUILD_TESTING=ON
                  cmake --build build-native --parallel 2

            - name: Run native contracts
              id: native-contracts
              if: matrix.python-version == '3.11'
              shell: pwsh
              env:
                  QT_QPA_PLATFORM: offscreen
              run: |
                  $env:PATH = "$env:SLANG_ROOT\bin;$env:PATH"
                  ctest --test-dir build-native --output-on-failure

            - name: Run D3D11 RHI smoke
              id: d3d11
              if: matrix.python-version == '3.11'
              shell: pwsh
              run: |
                  $env:PATH = "$env:SLANG_ROOT\bin;$env:PATH"
                  .\build-native\miskeyed-workbench.exe --rhi d3d11 --rhi-smoke-test

            - name: Run Vulkan RHI smoke with SwiftShader
              id: vulkan
              if: matrix.python-version == '3.11'
              shell: pwsh
              run: |
                  $icd = Get-ChildItem "C:\Program Files\Google\Chrome\Application" `
                    -Filter vk_swiftshader_icd.json -Recurse -ErrorAction SilentlyContinue `
                    | Select-Object -First 1
                  if (-not $icd) { throw "Chrome SwiftShader Vulkan ICD was not found" }
                  $manifest = Get-Content $icd.FullName -Raw | ConvertFrom-Json
                  $driver = $manifest.ICD.library_path
                  if (-not [IO.Path]::IsPathRooted($driver)) {
                      $driver = Join-Path $icd.DirectoryName $driver
                  }
                  if (-not (Test-Path $driver)) { throw "SwiftShader driver not found: $driver" }
                  $env:VK_DRIVER_FILES = $icd.FullName
                  $env:VK_ICD_FILENAMES = $icd.FullName
                  $env:PATH = "$([IO.Path]::GetDirectoryName($driver));$env:SLANG_ROOT\bin;$env:PATH"
                  .\build-native\miskeyed-workbench.exe --rhi vulkan --rhi-smoke-test

            - name: Record validation result
              if: always()
              shell: pwsh
              run: |
                  $native = if ('${{ matrix.python-version }}' -eq '3.11') { '${{ steps.native-contracts.outcome }}' } else { 'not-run' }
                  $runtime = if ('${{ matrix.python-version }}' -eq '3.11') { 'D3D11 + Vulkan/SwiftShader' } else { 'Platform runtime covered by Py3.11' }
                  $runtimeResult = if ('${{ matrix.python-version }}' -eq '3.11') {
                      if ('${{ steps.d3d11.outcome }}' -eq 'success' -and '${{ steps.vulkan.outcome }}' -eq 'success') { 'success' }
                      elseif ('${{ steps.d3d11.outcome }}' -eq 'failure' -or '${{ steps.vulkan.outcome }}' -eq 'failure') { 'failure' }
                      else { 'skipped' }
                  } else { 'not-run' }
                  python ci\validation_summary.py lane --platform "Windows x64" --python "${{ matrix.python-version }}" `
                    --wheel "${{ steps.package.outcome }}" --installed "${{ steps.installed.outcome }}" `
                    --installed-contracts "${{ steps.contracts.outcome }}" --native-contracts "$native" `
                    --runtime "$runtime" --runtime-result "$runtimeResult" --output validation.json

            - name: Upload validation result
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: validation-windows-x64-py${{ matrix.python-version }}
                  path: validation.json

            - name: Bundle wheel for transport
              shell: pwsh
              # Ship one gzip'd tar instead of loose .whl files. upload-artifact@v4
              # corrupts the bundled binaries when it re-zips a wheel; wrapping in a tar.gz
              # makes the payload opaque and gives it a gzip CRC, so any transport
              # corruption fails `tar -xzf` on download instead of reaching PyPI.
              run: tar -czf "wheels-windows-x64-py${{ matrix.python-version }}.tgz" -C wheelhouse .

            - uses: actions/upload-artifact@v7
              with:
                  name: wheel-windows-x64-py${{ matrix.python-version }}
                  path: wheels-windows-x64-py${{ matrix.python-version }}.tgz
                  retention-days: 60

    build-portable-wheels:
        name: ${{ matrix.label }} · Py${{ matrix.python-version }} · ${{ matrix.python-version == '3.11' && matrix.runtime-label || 'Wheel + Contracts' }}
        strategy:
            fail-fast: false
            matrix:
                python-version: ${{ fromJSON(inputs.python-versions) }}
                target: [linux-x64, macos-arm64, macos-x64]
                include:
                    - target: linux-x64
                      label: Linux x64
                      runtime-label: Wheel + Contracts + Vulkan
                      os: ubuntu-22.04
                      platform: linux
                      qt-host: linux
                      qt-arch: linux_gcc_64
                    - target: macos-arm64
                      label: macOS arm64
                      runtime-label: Wheel + Contracts + Metal
                      os: macos-14
                      platform: macos
                      qt-host: mac
                      qt-arch: clang_64
                    - target: macos-x64
                      label: macOS x86_64
                      runtime-label: Wheel + Contracts + Metal
                      os: macos-15-intel
                      platform: macos
                      qt-host: mac
                      qt-arch: clang_64
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install Linux system dependencies
              if: matrix.platform == 'linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libgl-dev libegl-dev libxkbcommon-dev libvulkan-dev mesa-vulkan-drivers xvfb

            - name: Install Qt ${{ env.QT_VERSION }} dev SDK
              uses: jurplel/install-qt-action@v4
              with:
                  version: ${{ env.QT_VERSION }}
                  host: ${{ matrix.qt-host }}
                  target: desktop
                  arch: ${{ matrix.qt-arch }}
                  cache: true
                  setup-python: false

            - name: Cache Slang SDK
              uses: actions/cache@v6
              with:
                  path: ${{ runner.temp }}/slang
                  key: slang-${{ runner.os }}-${{ runner.arch }}-${{ env.SLANG_VERSION }}

            - name: Provision Slang SDK
              shell: bash
              run: |
                  set -euo pipefail
                  arch="$(uname -m)"
                  case "$arch" in
                    arm64) arch=aarch64 ;;
                    amd64) arch=x86_64 ;;
                  esac
                  ver="${SLANG_VERSION}"
                  dest="${RUNNER_TEMP}/slang"
                  runtime="lib/libslang.$([[ '${{ matrix.platform }}' == macos ]] && echo dylib || echo so)"
                  if [[ ! -f "$dest/$runtime" ]]; then
                    rm -rf "$dest"
                    mkdir -p "$dest"
                    asset="slang-${ver}-${{ matrix.platform }}-${arch}.zip"
                    curl --fail --location --retry 3 \
                      "https://github.com/shader-slang/slang/releases/download/v${ver}/${asset}" \
                      --output "${RUNNER_TEMP}/slang.zip"
                    unzip -q "${RUNNER_TEMP}/slang.zip" -d "$dest"
                  fi
                  echo "SLANG_ROOT=$dest" >> "$GITHUB_ENV"

            - name: Install build dependencies
              shell: bash
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install \
                    --index-url https://download.qt.io/official_releases/QtForPython/ \
                    --extra-index-url https://pypi.org/simple \
                    "PySide6==6.8.*" "shiboken6==6.8.*" "shiboken6-generator==6.8.*" \
                    "scikit-build-core==1.0.3" ninja
                  if [[ '${{ matrix.platform }}' == linux ]]; then
                    python -m pip install auditwheel patchelf
                  fi

            - name: Build wheel
              shell: bash
              env:
                  CMAKE_PREFIX_PATH: ${{ env.QT_ROOT_DIR }}
                  CMAKE_GENERATOR: Ninja
                  MACOSX_DEPLOYMENT_TARGET: "13.0"
              run: |
                  python -m pip wheel . --no-build-isolation --no-deps -w wheelhouse -v

            - name: Repair Linux wheel tag
              if: matrix.platform == 'linux'
              shell: bash
              run: |
                  mkdir repaired
                  auditwheel repair wheelhouse/*.whl -w repaired \
                    --exclude libQt6Core.so.6 \
                    --exclude libQt6Gui.so.6 \
                    --exclude libQt6Widgets.so.6 \
                    --exclude libpyside6.abi3.so.6.8 \
                    --exclude libshiboken6.abi3.so.6.8
                  rm wheelhouse/*.whl
                  mv repaired/*.whl wheelhouse/

            - name: Verify wheel artifact
              id: package
              shell: bash
              run: |
                  expected="cp${{ matrix.python-version }}"
                  expected="${expected/.}"
                  wheel="$(echo wheelhouse/*.whl)"
                  [[ "$(basename "$wheel")" == *"$expected"* ]]
                  python ci/wheelzip.py inspect "$wheel"

            - name: Verify wheel in a fresh environment
              id: installed
              shell: bash
              env:
                  QT_QPA_PLATFORM: offscreen
                  SLANG_ROOT: ""
              run: |
                  wheel="$(echo wheelhouse/*.whl)"
                  python -m venv "${RUNNER_TEMP}/wheel-check"
                  "${RUNNER_TEMP}/wheel-check/bin/python" -m pip install "$wheel"
                  "${RUNNER_TEMP}/wheel-check/bin/python" -c \
                    "import miskeyed.workbench as w; assert w.WorkbenchWindow"

            - name: Run Python contracts from the fresh wheel environment
              id: contracts
              shell: bash
              env:
                  QT_QPA_PLATFORM: offscreen
                  SLANG_ROOT: ""
              run: |
                  "${RUNNER_TEMP}/wheel-check/bin/python" -m pip install pytest
                  "${RUNNER_TEMP}/wheel-check/bin/python" -m pytest tests/installed -v

            - name: Build canonical native contract and RHI smoke harness
              if: matrix.python-version == '3.11'
              shell: bash
              env:
                  CMAKE_PREFIX_PATH: ${{ env.QT_ROOT_DIR }}
              run: |
                  cmake -S . -B build-native -G Ninja \
                    -DCMAKE_BUILD_TYPE=Release \
                    -DSLANG_ROOT="$SLANG_ROOT" \
                    -DMISKEYED_WORKBENCH_BUILD_APP=ON \
                    -DMISKEYED_WORKBENCH_BUILD_PYTHON=OFF \
                    -DBUILD_TESTING=ON
                  cmake --build build-native --parallel 2

            - name: Run native contracts
              id: native-contracts
              if: matrix.python-version == '3.11'
              shell: bash
              env:
                  QT_QPA_PLATFORM: offscreen
              run: ctest --test-dir build-native --output-on-failure

            - name: Run Linux Vulkan RHI smoke with Mesa lavapipe
              id: vulkan
              if: matrix.python-version == '3.11' && matrix.platform == 'linux'
              shell: bash
              env:
                  LIBGL_ALWAYS_SOFTWARE: "1"
                  MESA_VK_DEVICE_SELECT: lavapipe
                  QT_LOGGING_RULES: qt.rhi.*=true
              run: |
                  set -euo pipefail
                  icd=$(find /usr/share/vulkan/icd.d -type f -name '*lvp*.json' -print -quit)
                  test -f "$icd"
                  driver=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["ICD"]["library_path"])' "$icd")
                  echo "Vulkan ICD: $icd"
                  echo "Vulkan driver: $driver"
                  export VK_DRIVER_FILES="$icd"
                  export VK_ICD_FILENAMES="$icd"
                  xvfb-run -a ./build-native/miskeyed-workbench --rhi vulkan --rhi-smoke-test

            - name: Run macOS Metal RHI smoke
              id: metal
              if: matrix.python-version == '3.11' && matrix.platform == 'macos'
              shell: bash
              env:
                  QT_QPA_PLATFORM: cocoa
                  QT_LOGGING_RULES: qt.rhi.*=true
              run: ./build-native/miskeyed-workbench --rhi metal --rhi-smoke-test

            - name: Record validation result
              if: always()
              shell: bash
              run: |
                  if [[ '${{ matrix.python-version }}' != 3.11 ]]; then
                    runtime='Platform runtime covered by Py3.11'
                    runtime_result=not-run
                    native=not-run
                  elif [[ '${{ matrix.platform }}' == linux ]]; then
                    runtime='Vulkan/lavapipe'
                    runtime_result='${{ steps.vulkan.outcome }}'
                    native='${{ steps.native-contracts.outcome }}'
                  else
                    runtime=Metal
                    runtime_result='${{ steps.metal.outcome }}'
                    native='${{ steps.native-contracts.outcome }}'
                  fi
                  python ci/validation_summary.py lane --platform '${{ matrix.label }}' \
                    --python '${{ matrix.python-version }}' --wheel '${{ steps.package.outcome }}' \
                    --installed '${{ steps.installed.outcome }}' \
                    --installed-contracts '${{ steps.contracts.outcome }}' --native-contracts "$native" \
                    --runtime "$runtime" --runtime-result "$runtime_result" --output validation.json

            - name: Upload validation result
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: validation-${{ matrix.target }}-py${{ matrix.python-version }}
                  path: validation.json

            - name: Bundle wheel for transport
              shell: bash
              run: tar -czf "wheels-${{ matrix.target }}-py${{ matrix.python-version }}.tgz" -C wheelhouse .

            - uses: actions/upload-artifact@v7
              with:
                  name: wheel-${{ matrix.target }}-py${{ matrix.python-version }}
                  path: wheels-${{ matrix.target }}-py${{ matrix.python-version }}.tgz
                  retention-days: 60

    build-sdist:
        name: Source distribution
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - name: Build sdist
              run: |
                  # Pinned: newer scikit-build-core wheel writers emit a ZIP record PyPI's
                  # strict validator rejects ("Unknown record signature"); 1.0.3 is verified
                  # compliant. Kept identical in the wheel job for reproducibility.
                  python -m pip install "scikit-build-core==1.0.3"
                  mkdir -p dist
                  # Call the sdist backend directly. `python -m build` (even with
                  # --no-isolation) refuses to run unless every build-system.requires is
                  # installed, but the Qt-only PySide6/shiboken6/shiboken6-generator are
                  # irrelevant to packaging source — scikit-build-core just collects files.
                  python -c "import scikit_build_core.build as b; print(b.build_sdist('dist'))"
            - uses: actions/upload-artifact@v7
              with:
                  name: sdist
                  path: ./dist/*.tar.gz
                  retention-days: 60

    validation-summary:
        name: Workbench validation summary
        if: always()
        needs: [build-wheels, build-portable-wheels]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/download-artifact@v8
              continue-on-error: true
              with:
                  pattern: validation-*
                  path: validation-results
            - name: Publish validation table
              run: |
                  python ci/validation_summary.py summary \
                    --input validation-results --output validation-summary.md \
                    --python-versions '${{ inputs.python-versions }}'
                  cat validation-summary.md >> "$GITHUB_STEP_SUMMARY"

    release-candidate:
        name: Seal validated release candidate
        needs: [build-wheels, build-portable-wheels, build-sdist, validation-summary]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            # Keep artifact directories: flattening caused same-named transport archives
            # to overwrite one another before tar could diagnose the offending producer.
            - uses: actions/download-artifact@v8
              with:
                  pattern: wheel-*
                  path: candidate-input
            - uses: actions/download-artifact@v8
              with:
                  name: sdist
                  path: candidate-input/sdist
            - uses: actions/download-artifact@v8
              with:
                  pattern: validation-*
                  path: candidate-input
            - name: Create checksummed candidate manifest
              shell: bash
              run: |
                  set -euo pipefail
                  version=$(sed -nE 's/^version = "([^"]+)"/\1/p' pyproject.toml)
                  python3 ci/assemble_release.py create \
                    --input candidate-input --output release-candidate \
                    --version "$version" --source-sha "$GITHUB_SHA" \
                    --source-ref "$GITHUB_REF" --repository "$GITHUB_REPOSITORY" \
                    --workflow-ref "${{ github.workflow_ref }}" \
                    --python-versions '${{ inputs.python-versions }}'
            - uses: actions/upload-artifact@v7
              with:
                  name: release-candidate
                  path: release-candidate
                  retention-days: 60
